[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgt470-analyst"
version = "0.1.0"
description = "Local-first MGT470 decoupling analyst workflow engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "openai>=1.50",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
mgt470 = "mgt470_analyst.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
